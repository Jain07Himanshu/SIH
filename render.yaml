services:
  - type: web
    name: seva-setu
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && python seed_platform_demo.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
